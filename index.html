<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neckos Studio</title>
<meta name="description" content="Neckos Studio – Android aplikacije.">
<meta name="google-site-verification" content="FkAMHBRrdvdOBeFONH9ZE8zHxjEirA3M9Xhwh_M_fA4" />
<style>
  :root { --bg: #F5F6F3; --surface: #FFFFFF; --text: #16201C; --muted: #55605B; --border: #E4E7E2; --accent: #0F6E5C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0E1412; --surface: #18201D; --text: #E7ECE9; --muted: #A3AEA9; --border: #29332F; --accent: #5CC4AB; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 20px; }
  .card h2 { font-size: 18px; margin: 0 0 4px; }
  .card p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Neckos Studio</h1>
  <p class="muted">Android aplikacije · <a href="mailto:neckos.studio@gmail.com">neckos.studio@gmail.com</a></p>
  <div class="card">
    <h2>Garancije</h2>
    <p>Sve garancije sa fiskalnih računa na jednom mestu, sačuvane na tvom Google Drive-u.</p>
    <a href="garancije/privacy/">Politika privatnosti / Privacy Policy</a>
  </div>
</main>
</body>
</html>
